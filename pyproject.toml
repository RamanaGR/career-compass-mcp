[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "career-compass-mcp"
version = "0.1.0"
description = "Privacy-first Interactive Web Form Accessibility & Prefill Assistant MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Career Compass Contributors" }
]
dependencies = [
  "mcp>=1.12.0,<2.0.0",
  "playwright>=1.48.0",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.7",
]

[project.scripts]
career-compass-mcp = "compass_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compass_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
